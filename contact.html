<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css"/>
    <link rel="stylesheet" href="./css/global.css"/>
    <link rel="stylesheet" href="./css/contact.css"/>
    <link rel="stylesheet" href="./css/bootstrap-utilities.css"/>
    <link rel="preconnect" href="https://fonts.gstatic.com"/>
    <script src="https://kit.fontawesome.com/a13a0ffe77.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Halant:wght@600&family=Hind:wght@400;500;700&display=swap"
          rel="stylesheet"/>
    <title>Contatti - Laila Tronci</title>
</head>

<body>
<div id="header-placeholder"></div>
<main id="main-content" tabindex="-1" class="wrapper">
    <section id="contact">
        <h1 class="title-header">Contatti</h1>
        <div class="d-flex flex-column flex-md-row gap-5">
            <div>
                <p class="text-light flex-fill">
                    Per qualsiasi richiesta relativa alle mie opere, informazioni su prezzi, commissioni su misura o
                    collaborazioni, potete contattarmi tramite il bottone qui sotto.
                </p>

                <button class="mt-5 bg-transparent border-0" role="button"><a class="contact-button liquid link-button" href="mailto:commissionilailatronci@outlook.com">MANDA UNA MAIL</a></button>
            </div>
            <div class="flex-fill mb-3">
                <ul class="contact-list">
                    <li class="list-item mb-4"><i class="fa fa-map-marker fa-2x"></i><span class="contact-text place">Cagliari, Italia</span>
                    </li>
                    <li class="list-item mb-4"><i class="fa fa-envelope fa-2x"></i><span class="contact-text mail hover-underline-animation"><a
                            href="mailto:commissionilailatronci@outlook.com" title="Send me an email">commissionilailatronci@outlook.com</a></span></li>
                </ul>
            </div>
        </div>
    </section>
</main>
<hr class="mt-5">
<div id="footer-placeholder"></div>
<script src="./js/load-component.js"></script>

</body>

</html>
